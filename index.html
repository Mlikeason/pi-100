<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>π 100 — 圆周率记忆挑战</title>
    <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
    <link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="π 100">
    <meta name="theme-color" content="#004F3F">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #00362A;        /* darker green for modal contrast */
            --bg: #004F3F;             /* icon background — deep forest green */
            --surface: #016150;        /* keypad / cards */
            --surface-2: #027360;      /* hover / active */
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.18);

            --ink: #F4EFE2;            /* warm paper white */
            --ink-dim: #A3C2B6;        /* faded annotation — slight green */
            --ink-faint: #6B8B7E;

            --mint: #5BD08B;           /* icon π — bright mint green, active / progress */
            --gold: #E8B860;           /* mustard — π symbol, achievement */
            --rose: #F2A6A6;           /* dusty rose — wrong */
            --sky:  #9CC7C9;           /* soft sea — secondary */

            --backdrop: rgba(0, 30, 24, 0.78);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* Hidden iOS-haptic switch — keep in layout (not display:none) or the
           label click won't fire the native haptic. */
        #haptic-trigger, #haptic-switch {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background:
                radial-gradient(ellipse 70% 50% at 50% 0%, rgba(91, 208, 139, 0.10), transparent 60%),
                radial-gradient(ellipse 70% 50% at 50% 100%, rgba(232, 184, 96, 0.07), transparent 60%),
                var(--bg);
            background-attachment: fixed;
            position: relative;
        }
        /* Faint geometric watermark: unit circle behind everything */
        body::before {
            content: '';
            position: fixed;
            left: 50%;
            top: 48%;
            width: 380px;
            height: 380px;
            margin-left: -190px;
            margin-top: -190px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            left: 50%;
            top: 48%;
            width: 1px;
            height: 380px;
            margin-left: 0;
            margin-top: -190px;
            background: rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding:
                max(64px, calc(env(safe-area-inset-top) + 14px))
                16px
                max(10px, env(safe-area-inset-bottom));
            min-height: 0;
        }

        /* Top status — light, like a textbook running header */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 4px 2px 10px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 4px;
        }
        .stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .stat.right { align-items: flex-end; }
        .stat .label {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--ink-faint);
        }
        .stat .value {
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(20px, 5.5vw, 24px);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
            line-height: 1.1;
        }
        .stat.time .value { color: var(--mint); }
        .stat.progress .value { color: var(--ink); }
        .stat.progress .value .total { color: var(--ink-faint); font-weight: 400; }

        /* The π = 3. prefix — mathematical typography */
        .prefix {
            text-align: center;
            margin: 14px 0 14px;
            font-family: 'EB Garamond', Georgia, serif;
            font-size: clamp(34px, 9vw, 42px);
            line-height: 1;
            color: var(--gold);
            font-weight: 400;
        }
        .prefix .pi {
            font-style: italic;
            margin-right: 6px;
        }
        .prefix .eq {
            color: var(--ink-dim);
            font-weight: 400;
            margin: 0 6px;
        }
        .prefix .three {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78em;
            color: var(--ink);
            font-weight: 500;
            vertical-align: 0.04em;
        }

        /* Scrollable digit grid */
        .grid-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 4px 0 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .grid-scroll::-webkit-scrollbar { display: none; }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        .row {
            display: flex;
            gap: 18px;
            align-items: center;
        }
        .row-half {
            display: flex;
            gap: 6px;
        }
        .cell {
            width: clamp(26px, 7.5vw, 32px);
            height: clamp(34px, 9vw, 42px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border-bottom: 1.5px solid var(--line-strong);
            border-radius: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: clamp(18px, 5vw, 22px);
            font-weight: 500;
            color: var(--ink);
            transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            position: relative;
        }
        .cell:not(:empty) {
            color: var(--ink);
        }
        .cell.active {
            border-bottom-color: var(--mint);
            color: var(--mint);
        }
        .cell.active::after {
            content: '';
            position: absolute;
            left: 30%; right: 30%;
            bottom: -1.5px;
            height: 1.5px;
            background: var(--mint);
            box-shadow: 0 0 8px rgba(110, 231, 197, 0.7);
            animation: cursorBlink 1.1s ease-in-out infinite;
        }
        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.35; }
        }
        .cell.wrong {
            color: var(--rose);
            border-bottom-color: var(--rose);
        }

        /* Keypad — clean rounded tiles */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 14px 0 4px;
            justify-items: stretch;
            flex-shrink: 0;
        }
        .key {
            height: clamp(56px, 16vw, 66px);
            border-radius: 12px;
            border: 1px solid var(--line);
            font-family: 'Inter', sans-serif;
            font-size: clamp(20px, 5.6vw, 24px);
            font-weight: 500;
            cursor: pointer;
            background: var(--surface);
            color: var(--ink);
            transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            padding: 0;
            font-variant-numeric: tabular-nums;
            position: relative;
            overflow: hidden;
        }
        .key:active {
            background: var(--surface-2);
        }
        /* Brief "click" animation triggered via JS on every keypress */
        .key.tapped {
            animation: keyTap 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes keyTap {
            0%   { transform: scale(1); }
            35%  { transform: scale(0.86); }
            100% { transform: scale(1); }
        }
        /* Ripple flash on number keys */
        .key.num.tapped::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at center, rgba(91, 208, 139, 0.45), transparent 70%);
            animation: keyFlash 0.28s ease-out;
            pointer-events: none;
        }
        @keyframes keyFlash {
            from { opacity: 0.9; }
            to   { opacity: 0; }
        }
        .key.hint {
            background: rgba(232, 184, 96, 0.18);
            border-color: rgba(232, 184, 96, 0.55);
            color: var(--gold);
            box-shadow: 0 0 18px rgba(232, 184, 96, 0.25);
            animation: hintBreath 1.4s ease-in-out infinite;
        }
        @keyframes hintBreath {
            0%, 100% { box-shadow: 0 0 14px rgba(232, 184, 96, 0.18); }
            50%      { box-shadow: 0 0 22px rgba(232, 184, 96, 0.38); }
        }
        .key.clear {
            background: transparent;
            border: 1px solid rgba(232, 155, 155, 0.4);
            color: var(--rose);
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 500;
        }
        .key.clear:active {
            background: rgba(232, 155, 155, 0.1);
        }
        .key.medal {
            background: transparent;
            border: 1px solid rgba(232, 184, 96, 0.4);
            color: var(--gold);
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 500;
        }
        .key.medal:active {
            background: rgba(232, 184, 96, 0.1);
        }

        /* Modal backdrop */
        .backdrop {
            position: fixed; inset: 0;
            background: var(--backdrop);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
        }
        .backdrop.show { display: flex; }
        .modal {
            background: var(--bg-deep);
            border: 1px solid var(--line-strong);
            border-radius: 16px;
            padding: 26px 24px 22px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
            animation: pop 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        @keyframes pop {
            from { opacity: 0; transform: scale(0.96) translateY(8px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Soft halo for celebration */
        .modal.celebrate::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 17px;
            background: conic-gradient(from 0deg, rgba(232, 184, 96, 0.5), rgba(110, 231, 197, 0.5), rgba(143, 184, 232, 0.5), rgba(232, 184, 96, 0.5));
            z-index: -1;
            filter: blur(14px);
            opacity: 0.6;
            animation: haloSpin 6s linear infinite;
        }
        @keyframes haloSpin {
            to { transform: rotate(360deg); }
        }

        .achievement {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 30px;
            font-weight: 600;
            color: var(--gold);
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .modal h2 {
            font-family: 'EB Garamond', Georgia, serif;
            margin: 0 0 18px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            color: var(--ink);
            font-style: italic;
            letter-spacing: 0.3px;
        }
        .modal .row-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 10px 0;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
        }
        .row-info .label {
            color: var(--ink-dim);
            font-weight: 400;
        }
        .row-info .value {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: var(--ink);
        }
        .row-info.bonus .value { color: var(--mint); }
        .row-info.time .value { color: var(--sky); }
        .row-info.final {
            border-top: 1px solid var(--line);
            margin-top: 8px;
            padding-top: 16px;
        }
        .row-info.final .label {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 17px;
            color: var(--ink);
        }
        .row-info.final .value {
            font-family: 'EB Garamond', Georgia, serif;
            font-size: 28px;
            color: var(--gold);
            font-weight: 600;
        }

        /* Buttons — refined math-elegant style */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }
        .btn {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid transparent;
            border-radius: 10px;
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            color: var(--ink);
            letter-spacing: 0.4px;
            transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
            position: relative;
        }
        .btn.primary {
            background: var(--mint);
            color: var(--bg-deep);
            border-color: var(--mint);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset, 0 6px 18px -8px rgba(110, 231, 197, 0.55);
        }
        .btn.primary:hover {
            background: #82eecd;
        }
        .btn.primary:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.1) inset, 0 2px 6px -2px rgba(110, 231, 197, 0.4);
        }
        .btn.secondary {
            background: transparent;
            border-color: var(--line-strong);
            color: var(--ink);
        }
        .btn.secondary:hover {
            border-color: var(--mint);
            color: var(--mint);
        }
        .btn.secondary:active {
            transform: translateY(1px);
            background: rgba(110, 231, 197, 0.06);
        }
        .btn.full { flex: 1 1 100%; }

        /* Name input section */
        .name-section {
            margin: 4px 0 14px;
            display: flex;
            align-items: baseline;
            gap: 10px;
            padding: 10px 12px;
            border: 1px dashed var(--line-strong);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
        }
        .name-section .name-label {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 15px;
            color: var(--ink-dim);
            flex-shrink: 0;
        }
        .name-section input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--ink);
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 17px;
            font-weight: 600;
            padding: 2px 0;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
            min-width: 0;
        }
        .name-section input::placeholder {
            color: var(--ink-faint);
            font-weight: 400;
        }
        .name-section input:focus {
            border-bottom-color: var(--mint);
        }
        .save-status {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: var(--ink-faint);
            text-align: center;
            margin-top: 8px;
            min-height: 16px;
            letter-spacing: 0.4px;
        }
        .save-status.ok { color: var(--mint); }
        .save-status.err { color: var(--rose); }

        /* Tabs in scoreboard modal */
        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            margin: 0 0 12px;
        }
        .tab {
            flex: 1;
            padding: 8px 10px;
            background: transparent;
            border: none;
            border-radius: 7px;
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 15px;
            font-weight: 600;
            color: var(--ink-dim);
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .tab.active {
            background: var(--surface-2);
            color: var(--ink);
        }

        /* Leaderboard list */
        .leader-list {
            max-height: 50vh;
            overflow-y: auto;
            margin: 0 0 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }
        .leader-row {
            display: grid;
            grid-template-columns: 26px 1fr auto auto;
            gap: 10px;
            align-items: baseline;
            padding: 10px 4px;
            border-bottom: 1px solid var(--line);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .leader-row:last-child { border-bottom: none; }
        .leader-row .rank {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 600;
            color: var(--ink-dim);
            font-size: 16px;
        }
        .leader-row .name {
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-weight: 600;
            color: var(--ink);
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .leader-row .name .date {
            font-family: 'Inter', sans-serif;
            font-style: normal;
            font-weight: 400;
            color: var(--ink-faint);
            font-size: 11px;
            margin-left: 6px;
            letter-spacing: 0.3px;
        }
        .leader-row .time {
            font-family: 'JetBrains Mono', monospace;
            color: var(--mint);
            font-weight: 500;
            font-size: 13px;
        }
        .leader-row .pts {
            font-family: 'JetBrains Mono', monospace;
            color: var(--gold);
            font-weight: 500;
            font-size: 13px;
            min-width: 42px;
            text-align: right;
        }
        .leader-row.self {
            background: rgba(110, 231, 197, 0.06);
            border-radius: 6px;
            padding-left: 6px;
            padding-right: 6px;
        }
        .leader-row.self .name {
            color: var(--mint);
        }
        /* Highlight top 3 ranks in leaderboard tab */
        #leader-list.rank-view .leader-row:nth-child(1) .rank { color: var(--gold); }
        #leader-list.rank-view .leader-row:nth-child(2) .rank { color: var(--sky); }
        #leader-list.rank-view .leader-row:nth-child(3) .rank { color: var(--mint); }
        .empty {
            text-align: center;
            color: var(--ink-faint);
            padding: 28px;
            font-family: 'EB Garamond', Georgia, serif;
            font-style: italic;
            font-size: 16px;
        }
        .scope-note {
            text-align: center;
            color: var(--ink-faint);
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 6px 0 2px;
        }
    </style>
</head>
<body>
    <!-- iOS 17.4+ haptic hack: programmatically clicking the label fires the
         native UISwitch toggle haptic. No-op on other browsers. -->
    <label id="haptic-trigger" for="haptic-switch" aria-hidden="true"></label>
    <input id="haptic-switch" type="checkbox" switch aria-hidden="true" tabindex="-1">

    <div class="container">
        <div class="status-bar">
            <div class="stat time">
                <span class="label">Time</span>
                <span class="value" id="timer">00:00</span>
            </div>
            <div class="stat progress right">
                <span class="label">Digit</span>
                <span class="value"><span id="score">0</span><span class="total"> / 100</span></span>
            </div>
        </div>

        <div class="prefix">
            <span class="pi">π</span><span class="eq">=</span><span class="three">3.</span>
        </div>

        <div class="grid-scroll" id="grid-scroll">
            <div class="grid" id="grid"></div>
        </div>

        <div class="keypad" id="keypad"></div>
    </div>

    <!-- Game over modal -->
    <div class="backdrop" id="gameover-backdrop">
        <div class="modal" id="gameover-modal">
            <div class="achievement" id="achievement"></div>
            <h2>挑战完成</h2>

            <div class="name-section">
                <span class="name-label">署名</span>
                <input type="text" id="name-input" maxlength="16" placeholder="起个名字" autocomplete="off" spellcheck="false" />
            </div>

            <div class="row-info"><span class="label">基础得分</span><span class="value" id="m-base"></span></div>
            <div class="row-info bonus"><span class="label">时间加分</span><span class="value" id="m-bonus"></span></div>
            <div class="row-info time"><span class="label">用时</span><span class="value" id="m-time"></span></div>
            <div class="row-info final"><span class="label">最终得分</span><span class="value" id="m-final"></span></div>

            <div class="save-status" id="save-status"></div>

            <div class="btn-row">
                <button class="btn secondary" onclick="showLeaderboard()">成绩单</button>
                <button class="btn primary" onclick="resetGame()">再来一次</button>
            </div>
        </div>
    </div>

    <!-- Scoreboard modal (leaderboard + full log, tabbed) -->
    <div class="backdrop" id="leaderboard-backdrop">
        <div class="modal">
            <h2>成绩单</h2>
            <div class="tabs">
                <button class="tab active" data-tab="top" onclick="switchTab('top')">排行榜</button>
                <button class="tab" data-tab="all" onclick="switchTab('all')">全部记录</button>
            </div>
            <div class="leader-list" id="leader-list"></div>
            <div class="scope-note" id="scope-note"></div>
            <div class="btn-row">
                <button class="btn secondary full" onclick="closeLeaderboard()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // BACKEND CONFIG — Pantry (free, no auth key in client)
        // ------------------------------------------------------------
        // 1. Sign up at https://getpantry.cloud  (only needs an email)
        // 2. Copy the "Pantry ID" you receive (looks like a UUID)
        // 3. Replace the string below with it
        // If left empty/placeholder, the app falls back to local-only
        // storage — your scores stay on this device.
        // ============================================================
        const PANTRY_ID = '8bf6c12e-4141-4ca2-b488-622a5bfe85ff';
        const BASKET = 'pi100-scores';
        const REMOTE_URL = PANTRY_ID
            ? `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET}`
            : null;

        const PI_DIGITS = "14159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196";
        const TARGET_TIME = 180;
        const HINT_DELAY_MS = 3000;
        const LOCAL_RECORDS_KEY = 'pi100_records';      // unified records log
        const LEGACY_TOP_KEY = 'pi100_top_scores';      // migrate from earlier version
        const NAME_KEY = 'pi100_player_name';
        const TOP_N = 10;
        const MAX_REMOTE = 500;
        const KEYS = ['1','2','3','4','5','6','7','8','9','M','0','C'];

        let currentIndex = 0;
        let score = 0;
        let inputs = new Array(100).fill('');
        let wrongAt = new Array(100).fill(false);
        let elapsedTime = 0;
        let lastInputTime = Date.now();
        let showHint = false;
        let mainTimer = null;
        let hintTimer = null;
        let gameDone = false;
        let pendingRecord = null;       // the just-finished record being edited
        let pendingUploadTimer = null;  // debounce timer for remote upload
        let pendingUploadPromise = null;// in-flight upload (serialised)
        let cachedAllRecords = [];      // last fetched all records
        let activeTab = 'top';

        const gridScroll = document.getElementById('grid-scroll');
        const grid = document.getElementById('grid');
        const keypad = document.getElementById('keypad');
        const timerEl = document.getElementById('timer');
        const scoreEl = document.getElementById('score');
        const gameoverBd = document.getElementById('gameover-backdrop');
        const gameoverModal = document.getElementById('gameover-modal');
        const leaderboardBd = document.getElementById('leaderboard-backdrop');
        const leaderList = document.getElementById('leader-list');
        const nameInput = document.getElementById('name-input');
        const saveStatus = document.getElementById('save-status');
        const scopeNote = document.getElementById('scope-note');

        // ---- Tactile feedback layer ----
        // Combines three things, each a no-op where unsupported:
        //   1. Android Chrome — navigator.vibrate(pattern)
        //   2. iOS 17.4+ Safari — clicking a hidden <label for=switch>
        //      triggers the native UISwitch haptic
        //   3. Web Audio — a very short tick so every device gets *something*
        const hapticTrigger = document.getElementById('haptic-trigger');
        let audioCtx = null;
        function ensureAudio() {
            if (audioCtx) return audioCtx;
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            } catch {}
            return audioCtx;
        }
        function tick(freq, duration = 0.04, vol = 0.07, type = 'sine') {
            const ctx = ensureAudio();
            if (!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();
            const t = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t);
            osc.stop(t + duration + 0.02);
        }
        function feedback(kind) {
            // 1. iOS native UISwitch haptic via hidden switch click
            try { hapticTrigger && hapticTrigger.click(); } catch {}
            // 2. Android vibration
            try {
                if (navigator.vibrate) {
                    if (kind === 'wrong') navigator.vibrate([18, 40, 26]);
                    else if (kind === 'finish') navigator.vibrate([30, 60, 30, 60, 50]);
                    else if (kind === 'util') navigator.vibrate(14);
                    else navigator.vibrate(8);
                }
            } catch {}
            // 3. Audio click — subtle, distinct timbre per kind
            if (kind === 'correct')      tick(1400, 0.035, 0.06, 'sine');
            else if (kind === 'wrong')   tick(220, 0.10, 0.10, 'square');
            else if (kind === 'util')    tick(900, 0.05, 0.05, 'triangle');
            else if (kind === 'finish') { tick(660, 0.08, 0.08); setTimeout(() => tick(880, 0.08, 0.08), 90); setTimeout(() => tick(1320, 0.14, 0.08), 200); }
        }
        function animateKey(btn) {
            if (!btn) return;
            btn.classList.remove('tapped');
            // force reflow so the animation can replay on rapid presses
            void btn.offsetWidth;
            btn.classList.add('tapped');
        }

        function fmtTime(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function fmtDate(ts) {
            const d = new Date(ts);
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const HH = String(d.getHours()).padStart(2, '0');
            const MM = String(d.getMinutes()).padStart(2, '0');
            return `${mm}-${dd} ${HH}:${MM}`;
        }

        function buildGrid() {
            grid.innerHTML = '';
            for (let r = 0; r < 10; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let half = 0; half < 2; half++) {
                    const halfDiv = document.createElement('div');
                    halfDiv.className = 'row-half';
                    for (let c = 0; c < 5; c++) {
                        const idx = r * 10 + half * 5 + c;
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.id = `cell-${idx}`;
                        halfDiv.appendChild(cell);
                    }
                    row.appendChild(halfDiv);
                }
                grid.appendChild(row);
            }
        }

        function buildKeypad() {
            keypad.innerHTML = '';
            for (const k of KEYS) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'key';
                btn.textContent = k;
                btn.id = `key-${k}`;
                if (k === 'C') {
                    btn.classList.add('clear');
                    btn.addEventListener('click', () => { animateKey(btn); feedback('util'); cleanGame(); });
                } else if (k === 'M') {
                    btn.classList.add('medal');
                    btn.addEventListener('click', () => { animateKey(btn); feedback('util'); showLeaderboard(); });
                } else {
                    btn.classList.add('num');
                    btn.addEventListener('click', () => handleInput(parseInt(k)));
                }
                keypad.appendChild(btn);
            }
        }

        function renderCell(idx) {
            const cell = document.getElementById(`cell-${idx}`);
            if (!cell) return;
            cell.textContent = inputs[idx];
            cell.classList.toggle('wrong', wrongAt[idx]);
            cell.classList.toggle('active', idx === currentIndex && !gameDone);
        }

        function renderAllCells() {
            for (let i = 0; i < 100; i++) renderCell(i);
        }

        function renderHint() {
            for (let i = 0; i <= 9; i++) {
                const btn = document.getElementById(`key-${i}`);
                if (btn) btn.classList.remove('hint');
            }
            if (showHint && !gameDone && currentIndex < 100) {
                const correct = PI_DIGITS[currentIndex];
                const btn = document.getElementById(`key-${correct}`);
                if (btn) btn.classList.add('hint');
            }
        }

        function scrollToCurrent() {
            const row = Math.floor(currentIndex / 10);
            if (row < 5) {
                gridScroll.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }
            const anchorRowIdx = row - 4;
            const anchorCell = document.getElementById(`cell-${anchorRowIdx * 10}`);
            if (!anchorCell) return;
            const anchorRow = anchorCell.parentElement.parentElement;
            gridScroll.scrollTo({ top: anchorRow.offsetTop, behavior: 'smooth' });
        }

        function handleInput(num) {
            if (gameDone || currentIndex >= 100) return;
            const idx = currentIndex;
            const correct = parseInt(PI_DIGITS[idx]);
            // visual press feedback on whichever key was hit
            animateKey(document.getElementById(`key-${num}`));
            if (num === correct) {
                inputs[idx] = String(num);
                wrongAt[idx] = false;
                score++;
                feedback('correct');
            } else {
                inputs[idx] = String(correct);
                wrongAt[idx] = true;
                feedback('wrong');
            }
            currentIndex++;
            renderCell(idx);
            if (currentIndex < 100) {
                renderCell(currentIndex);
                scrollToCurrent();
            }
            lastInputTime = Date.now();
            showHint = false;
            scoreEl.textContent = score;
            renderHint();
            if (currentIndex >= 100) finishGame();
        }

        function achievementText(seconds) {
            if (seconds <= 110) return '出类拔萃';
            if (seconds <= 120) return '游刃有余';
            if (seconds <= 130) return '颇为可观';
            if (seconds <= 150) return '圆满';
            return '';
        }

        function finishGame() {
            gameDone = true;
            stopTimer();
            stopHintTimer();
            const timeBonus = Math.max(0, TARGET_TIME - elapsedTime);
            const finalScore = score + timeBonus;

            const storedName = localStorage.getItem(NAME_KEY) || '';
            nameInput.value = storedName;

            const record = {
                id: 'r_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                name: storedName || '匿名',
                score: finalScore,
                baseScore: score,
                timeBonus,
                timeUsed: elapsedTime,
                date: Date.now()
            };
            stageRecord(record);

            document.getElementById('m-base').textContent = score;
            document.getElementById('m-bonus').textContent = `+${timeBonus}`;
            document.getElementById('m-time').textContent = fmtTime(elapsedTime);
            document.getElementById('m-final').textContent = finalScore;
            const ach = achievementText(elapsedTime);
            const achEl = document.getElementById('achievement');
            achEl.textContent = ach;
            achEl.style.display = ach ? 'block' : 'none';
            gameoverModal.classList.toggle('celebrate', score >= 80);
            feedback('finish');
            gameoverBd.classList.add('show');

            // focus name input if empty so user is prompted to write one
            if (!storedName) {
                setTimeout(() => nameInput.focus(), 300);
            }
        }

        function startTimer() {
            stopTimer();
            timerEl.textContent = fmtTime(elapsedTime);
            mainTimer = setInterval(() => {
                elapsedTime++;
                timerEl.textContent = fmtTime(elapsedTime);
            }, 1000);
        }
        function stopTimer() { if (mainTimer) { clearInterval(mainTimer); mainTimer = null; } }

        function startHintTimer() {
            stopHintTimer();
            hintTimer = setInterval(() => {
                if (gameDone) return;
                if (Date.now() - lastInputTime >= HINT_DELAY_MS) {
                    if (!showHint) { showHint = true; renderHint(); }
                } else {
                    if (showHint) { showHint = false; renderHint(); }
                }
            }, 200);
        }
        function stopHintTimer() { if (hintTimer) { clearInterval(hintTimer); hintTimer = null; } }

        function cleanGame() {
            currentIndex = 0;
            score = 0;
            inputs = new Array(100).fill('');
            wrongAt = new Array(100).fill(false);
            elapsedTime = 0;
            lastInputTime = Date.now();
            showHint = false;
            gameDone = false;
            gameoverBd.classList.remove('show');
            gameoverModal.classList.remove('celebrate');
            leaderboardBd.classList.remove('show');
            scoreEl.textContent = score;
            renderAllCells();
            renderHint();
            startTimer();
            startHintTimer();
            gridScroll.scrollTo({ top: 0 });
        }

        async function resetGame() {
            await flushUpload();
            pendingRecord = null;
            cleanGame();
        }

        // ---- Records storage (local + remote) ----

        function getLocalRecords() {
            try {
                const raw = localStorage.getItem(LOCAL_RECORDS_KEY);
                if (raw) return JSON.parse(raw);
                // migrate from old format if present
                const legacy = localStorage.getItem(LEGACY_TOP_KEY);
                if (legacy) {
                    const old = JSON.parse(legacy).map(r => ({
                        id: 'r_' + r.date.toString(36),
                        name: '匿名',
                        ...r
                    }));
                    localStorage.setItem(LOCAL_RECORDS_KEY, JSON.stringify(old));
                    return old;
                }
                return [];
            } catch { return []; }
        }

        function setLocalRecords(records) {
            localStorage.setItem(LOCAL_RECORDS_KEY, JSON.stringify(records));
        }

        async function fetchRemoteRecords() {
            if (!REMOTE_URL) return null;
            try {
                const r = await fetch(REMOTE_URL);
                if (r.ok) {
                    const data = await r.json();
                    return Array.isArray(data.records) ? data.records : [];
                }
                // Pantry returns 400 when basket doesn't exist yet — that's fine,
                // it just means we haven't saved anything yet. Treat as empty.
                if (r.status === 400) {
                    try {
                        const data = await r.json();
                        if (typeof data?.error === 'string' &&
                            data.error.toLowerCase().includes('could not get basket')) {
                            return [];
                        }
                    } catch {}
                }
                return null;
            } catch { return null; }
        }

        async function pushRemoteRecords(records) {
            if (!REMOTE_URL) return { ok: false, status: 0 };
            try {
                const trimmed = records.slice(-MAX_REMOTE);
                const r = await fetch(REMOTE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ records: trimmed })
                });
                return { ok: r.ok, status: r.status };
            } catch { return { ok: false, status: 0 }; }
        }

        function setStatus(text, kind) {
            saveStatus.textContent = text;
            saveStatus.className = 'save-status' + (kind ? ' ' + kind : '');
        }

        // Stage a finished record for upload. Subsequent name edits mutate
        // pendingRecord; uploads are serialised so we always send the latest state.
        function stageRecord(rec) {
            pendingRecord = rec;
            // local save is synchronous and immediate
            const local = getLocalRecords();
            local.push({ ...rec });
            setLocalRecords(local);
            if (REMOTE_URL) {
                setStatus('稍后上传…');
                scheduleUpload(3000);  // give user time to type a name
            } else {
                setStatus('已保存到本机', 'ok');
            }
        }

        function applyNameToPending(newName) {
            if (!pendingRecord) return;
            pendingRecord.name = newName;
            // mirror to local storage
            const local = getLocalRecords();
            const lr = local.find(r => r.id === pendingRecord.id);
            if (lr) { lr.name = newName; setLocalRecords(local); }
            // re-schedule remote upload with the new name
            if (REMOTE_URL) scheduleUpload(1200);
        }

        function scheduleUpload(delay) {
            if (!REMOTE_URL || !pendingRecord) return;
            clearTimeout(pendingUploadTimer);
            pendingUploadTimer = setTimeout(runUpload, delay);
        }

        // Serialised upload. If one is already in flight, queue another after it.
        async function runUpload() {
            if (pendingUploadPromise) {
                await pendingUploadPromise;
            }
            if (!pendingRecord) return;
            const snapshot = { ...pendingRecord };
            pendingUploadPromise = (async () => {
                setStatus('上传中…');
                const remote = await fetchRemoteRecords();
                if (remote === null) {
                    setStatus('云端连接失败，仅本地', 'err');
                    return;
                }
                const idx = remote.findIndex(r => r.id === snapshot.id);
                if (idx >= 0) remote[idx] = snapshot;
                else remote.push(snapshot);
                const result = await pushRemoteRecords(remote);
                if (result.ok) {
                    setStatus('已上传到云端 ✓', 'ok');
                } else {
                    setStatus(`云端写入失败 (${result.status || 'network'})`, 'err');
                }
            })();
            try { await pendingUploadPromise; }
            finally { pendingUploadPromise = null; }
        }

        // Flush any pending debounced upload immediately and wait for it.
        async function flushUpload() {
            if (pendingUploadTimer) {
                clearTimeout(pendingUploadTimer);
                pendingUploadTimer = null;
                await runUpload();
            } else if (pendingUploadPromise) {
                await pendingUploadPromise;
            }
        }

        // ---- Leaderboard / scoreboard rendering ----

        async function showLeaderboard() {
            // make sure any in-flight or pending upload completes before we fetch
            await flushUpload();
            leaderboardBd.classList.add('show');
            renderRecords();  // show local immediately
            if (REMOTE_URL) {
                scopeNote.textContent = '加载中…';
                const remote = await fetchRemoteRecords();
                if (remote) {
                    cachedAllRecords = remote;
                } else {
                    cachedAllRecords = getLocalRecords();
                    scopeNote.textContent = '云端连接失败，显示本机记录';
                }
                renderRecords();
            } else {
                scopeNote.textContent = '本机记录（未配置云端）';
            }
        }

        function switchTab(name) {
            activeTab = name;
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === name);
            });
            renderRecords();
        }

        function renderRecords() {
            const records = (REMOTE_URL && cachedAllRecords.length) ? cachedAllRecords : getLocalRecords();
            leaderList.innerHTML = '';
            leaderList.classList.toggle('rank-view', activeTab === 'top');

            let view;
            if (activeTab === 'top') {
                view = [...records].sort((a, b) => a.timeUsed - b.timeUsed).slice(0, TOP_N);
            } else {
                view = [...records].sort((a, b) => b.date - a.date);
            }

            if (view.length === 0) {
                leaderList.innerHTML = '<div class="empty">尚无记录</div>';
                if (scopeNote.textContent === '加载中…') scopeNote.textContent = '';
                return;
            }

            view.forEach((rec, i) => {
                const row = document.createElement('div');
                row.className = 'leader-row';
                if (rec.id && pendingRecord && rec.id === pendingRecord.id) row.classList.add('self');
                const rankCol = activeTab === 'top' ? `${i + 1}` : '·';
                const nameHtml = `<span class="name">${escapeHTML(rec.name || '匿名')}<span class="date">${fmtDate(rec.date)}</span></span>`;
                row.innerHTML = `
                    <span class="rank">${rankCol}</span>
                    ${nameHtml}
                    <span class="time">${fmtTime(rec.timeUsed)}</span>
                    <span class="pts">${rec.score}</span>
                `;
                leaderList.appendChild(row);
            });

            if (scopeNote.textContent === '加载中…') {
                scopeNote.textContent = REMOTE_URL ? `共 ${records.length} 条 · 云端记录` : `共 ${records.length} 条 · 本机记录`;
            } else if (!scopeNote.textContent) {
                scopeNote.textContent = REMOTE_URL ? `共 ${records.length} 条 · 云端记录` : `共 ${records.length} 条 · 本机记录`;
            }
        }

        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function closeLeaderboard() { leaderboardBd.classList.remove('show'); }

        leaderboardBd.addEventListener('click', (e) => {
            if (e.target === leaderboardBd) closeLeaderboard();
        });

        // Best-effort flush if user closes the tab while an upload is pending
        window.addEventListener('beforeunload', () => {
            if (REMOTE_URL && pendingRecord && pendingUploadTimer) {
                clearTimeout(pendingUploadTimer);
                runUpload();
            }
        });

        // Name input: debounced — remember name locally, update pending record,
        // and let the upload pipeline re-send the latest version.
        let nameDebounce = null;
        nameInput.addEventListener('input', () => {
            clearTimeout(nameDebounce);
            const v = nameInput.value.trim();
            nameDebounce = setTimeout(() => {
                if (v) localStorage.setItem(NAME_KEY, v);
                applyNameToPending(v || '匿名');
            }, 400);
        });
        // Flush immediately when the user leaves the field
        nameInput.addEventListener('blur', () => {
            clearTimeout(nameDebounce);
            const v = nameInput.value.trim();
            if (v) localStorage.setItem(NAME_KEY, v);
            applyNameToPending(v || '匿名');
            if (REMOTE_URL) scheduleUpload(0);
        });

        document.addEventListener('keydown', (e) => {
            // don't capture digits while typing in the name field
            if (document.activeElement === nameInput) return;
            if (e.key >= '0' && e.key <= '9' && !gameDone) {
                handleInput(parseInt(e.key));
            } else if (e.key === 'Escape') {
                if (leaderboardBd.classList.contains('show')) closeLeaderboard();
            }
        });

        buildGrid();
        buildKeypad();
        cleanGame();
    </script>
</body>
</html>
